<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="132" viewBox="0 0 1200 132" role="img" aria-labelledby="title desc">
  <title id="title">Afloat16 — research and engineering</title>
  <desc id="desc">Robotics, large language models, and 3D reconstruction. A compact geometric banner with subtle animated traces. Animation respects reduced-motion preferences.</desc>
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111923"/>
      <stop offset="1" stop-color="#182637"/>
    </linearGradient>
    <linearGradient id="trace" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#A2AEF5"/>
      <stop offset="1" stop-color="#6CC6EB"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="130" rx="16"/></clipPath>
  </defs>
  <style>
    .trace { animation: trace-flow 24s linear infinite; }
    .node { animation: node-glow 8s ease-in-out infinite; }
    .node-late { animation-delay: -4s; }
    @keyframes trace-flow { to { stroke-dashoffset: -180; } }
    @keyframes node-glow { 0%, 100% { opacity: .4; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .trace, .node { animation: none; } }
  </style>
  <rect x="1" y="1" width="1198" height="130" rx="16" fill="url(#wash)" stroke="#2C4055" stroke-width="2"/>
  <g clip-path="url(#frame)" fill="none">
    <path d="M908 24V108" stroke="#2C4055"/>
    <path d="M944 24H1170 M944 108H1170 M963 14V119 M1146 14V119" stroke="#2C4055" stroke-dasharray="2 7"/>
    <path d="M926 118C981 102 1005 109 1036 73S1114 18 1199 17" stroke="url(#trace)" stroke-width="13" opacity=".09"/>
    <path d="M926 118C981 102 1005 109 1036 73S1114 18 1199 17" stroke="url(#trace)" stroke-width="1.2" opacity=".35"/>
    <path class="trace" d="M926 118C981 102 1005 109 1036 73S1114 18 1199 17" stroke="url(#trace)" stroke-width="2" stroke-dasharray="20 70" stroke-dashoffset="0" opacity=".9"/>
    <path d="M1000 43L1053 23L1113 45L1060 67Z M1000 80L1053 60L1113 82L1060 104Z M1000 43V80 M1053 23V60 M1113 45V82 M1060 67V104" stroke="#54728E" stroke-width="1.2"/>
    <path d="M1018 37L1078 60 M1035 30L1095 52 M1020 51L1073 30 M1040 59L1093 37 M1018 74L1078 97 M1035 67L1095 89" stroke="#54728E" stroke-width=".8" opacity=".45"/>
    <path d="M985 31h8m-4-4v8 M1130 99h8m-4-4v8" stroke="#54728E" stroke-width="1"/>
    <circle class="node" cx="1060" cy="67" r="10" stroke="#6CC6EB" stroke-width="1" opacity=".4"/>
    <circle class="node node-late" cx="1053" cy="23" r="8" stroke="#A2AEF5" stroke-width="1" opacity=".4"/>
  </g>
  <g fill="#6CC6EB">
    <circle cx="1000" cy="43" r="2.6"/><circle cx="1113" cy="45" r="2.6"/>
    <circle cx="1060" cy="67" r="3.4"/><circle cx="1000" cy="80" r="2.4"/>
    <circle cx="1113" cy="82" r="2.4"/><circle cx="1073" cy="30" r="1.9"/>
    <circle cx="1020" cy="51" r="1.9"/><circle cx="1095" cy="89" r="1.9"/>
  </g>
  <g fill="#A2AEF5">
    <circle cx="1053" cy="23" r="3"/><circle cx="1060" cy="104" r="2.5"/>
    <circle cx="1035" cy="30" r="1.9"/><circle cx="1040" cy="59" r="1.9"/>
    <circle cx="1053" cy="60" r="2.2"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <path d="M38 32H57" stroke="#6CC6EB" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="36" font-size="11" font-weight="600" letter-spacing="1.6" fill="#A8BBD0">RESEARCH &amp; ENGINEERING</text>
    <text x="36" y="96" font-size="52" font-weight="700" letter-spacing="-1.8" fill="#E9F1FA">Afloat16</text>
    <text x="330" y="59" font-size="24" font-weight="500" letter-spacing="-.35" fill="#E9F1FA">Robotics · LLMs · 3D reconstruction</text>
    <text x="331" y="88" font-size="16" fill="#A8BBD0">Reproducible research · Upstream engineering</text>
  </g>
</svg>
